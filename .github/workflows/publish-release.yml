name: Publish project release action

on:
  # Releases are dispatch-only - merges never publish (HACS is a pull model;
  # the maintainer ships on demand). Dispatch from main cuts a STABLE release
  # (clean NBGV SemVer); dispatch from develop cuts a PRERELEASE (NBGV appends
  # -gSHA so successive prereleases never collide on the same tag).
  workflow_dispatch: {}
  # The weekly schedule RETESTS the shipped main against the latest HA matrix
  # and STOPS - it never publishes. It is the publisher-side complement to
  # check-ha-version.yml (which retests develop): a red scheduled run flags
  # upstream HA drift breaking the released integration for a maintainer to act on.
  schedule:
    - cron: '0 2 * * MON'

# One global, ref-independent group so every publish serializes: a main-dispatch stable release and a develop-dispatch
# prerelease both push to the same GitHub Releases repo, so a ref-scoped group could run two publishes concurrently.
# Queue instead of cancel: cancelling a publish mid-flight can leave a half-created GitHub release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:

  gate:
    name: Gate dispatch ref job
    # Only main or develop may dispatch. main -> stable, develop -> prerelease
    # (NBGV classifies by github.ref). The schedule path skips this gate and
    # runs the retest-only leg below.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Assert dispatch ref step
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "develop" ]; then
              echo "::error::Publish must be dispatched from main (stable) or develop (prerelease); got ${{ github.ref_name }}."
              exit 1
          fi

  test-release:
    name: Test release job
    needs: [gate]
    # Reuses test-release-task.yml - the same suite that gates PR merges
    # (ruff, mypy --strict, pyright, pytest matrix, hassfest, HACS) - so
    # neither a dispatch against a regressed tip can publish nor a scheduled
    # retest of main can pass silently.
    #
    # Runs on:
    # - workflow_dispatch from main/develop (gate=success), and
    # - schedule (gate=skipped because the gate job is dispatch-only).
    # A `cancelled`/`failure` gate result skips this job, which then skips
    # create-release below - exactly what we want.
    #
    # `always() &&` is required here: without it, GitHub auto-skips a job
    # whose `needs:` dependency is skipped, regardless of the `if:` body -
    # so on the schedule (gate=skipped) test-release would silently skip.
    # `always()` overrides the auto-skip so the explicit success/skipped
    # allowlist runs and the scheduled retest of main actually executes.
    #
    # Pass `build: false` so test-release-task skips its no-publish
    # build-release child. The create-release job below builds the
    # artifact for real immediately after, and two builds in the same
    # workflow run would (a) produce two same-named `purpleair-zip`
    # artifacts and (b) double the build cost for no extra signal.
    if: >-
      always() &&
      (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    uses: ./.github/workflows/test-release-task.yml
    secrets: inherit
    with:
      build: false

  create-release:
    name: Publish project release job
    needs: [gate, test-release]
    # Publish ONLY on dispatch (never on schedule): the schedule retests main
    # and stops. Both dispatch refs publish on a green suite:
    # - dispatch on main:    gate=success, test-release=success -> stable.
    # - dispatch on develop: gate=success, test-release=success -> prerelease.
    # `test-release` must succeed - never `skipped`/`failure`/`cancelled` - so
    # a broken tip cannot ship.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.gate.result == 'success' &&
      needs.test-release.result == 'success'
    uses: ./.github/workflows/build-release-task.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      # Push to GitHub Releases (no NuGet/Docker Hub equivalents for an HA component).
      github: true

  # Release artifacts are an intra-run handoff (the durable copy lives on the GitHub release), so leaving them
  # accumulates against the small account-wide storage quota; delete them once every consumer has read them.
  cleanup-artifacts:
    name: Delete workflow artifacts job
    needs: [create-release]
    # always() so a failed run still cleans up; independent of any required check so housekeeping never gates a merge.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete workflow artifacts step
        # continue-on-error: best-effort housekeeping must never red the run, even on an unexpected failure.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! ids=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --paginate \
            --jq '.artifacts[].id'); then
            echo "::warning::Could not list run artifacts; skipping cleanup (storage may not be freed)."
            ids=""
          fi
          for artifact_id in $ids; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" \
              || echo "::warning::Failed to delete artifact $artifact_id; continuing."
          done
