name: Test pull request action

on:
  # The gate triggers on pull_request so the validator's pull-request-only steps, the prose gate among them, run (WORKFLOW.md D1.5).
  # The publisher's weekly schedule uploads coverage for main, so no push trigger is needed for the badge.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN gets no scope by default, and each job below grants only what it reads with.
permissions: {}

jobs:

  # One entry per target this repo builds, listing that target's own paths, so a touched target never falls through unfiltered (D1.1).
  # This repo carries its own build-release-asset hook, so .github/actions/** is listed too, since that hook builds the target.
  changes:
    name: Detect changed targets job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Filter changed paths step
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            release:
              - 'custom_components/**'
              - 'version.json'
              - '.github/actions/**'

  # The hub gate takes its pytest legs as an input, so they are read from .github/ha-test-versions.json at run time.
  # Kept until the hub validate task can read a test matrix from a tracked file.
  read-versions:
    name: Read HA test matrix job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build HA test matrix step
        id: matrix
        uses: ./.github/actions/ha-test-matrix

  # The hub lint job runs the doc lint, ruff, and mypy --strict against latest-stable.
  # Its unit-test job runs one pytest leg per matrix entry through the install-test-deps hook.
  # Its validate job runs the validate hook's hassfest, HACS, and pyright.
  # CODECOV_TOKEN is mapped by name, per the hub's coverage rule.
  validate:
    name: Validate sources job
    needs: [read-versions]
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@6e05308f8267088a4055607aaae7310548232bdb # 2.0.1479
    permissions:
      contents: read
      pull-requests: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      python-directories: |
        .
      python-versions: '["3.14"]'
      test-matrix: ${{ needs.read-versions.outputs.matrix }}

  # Never publishes and never uploads (D1.4): smoke: true disables every publish path in build-release-task.
  # Smoke mode builds purpleair.zip through the build-release-asset hook.
  smoke-build:
    name: Smoke build job
    needs: [changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@6e05308f8267088a4055607aaae7310548232bdb # 2.0.1479
    permissions:
      contents: read
    with:
      smoke: true
      # On a pull_request event github.ref_name is the PR ref (for example 123/merge), never the target branch.
      # The logical branch therefore reads base_ref first and falls back to ref_name only on a non-PR trigger.
      branch: ${{ github.base_ref || github.ref_name }}
      enable_release_asset: true
      enable_docker: false
      enable_nuget: false
      enable_pypi: false
      enable_dotnet_publish: false

  # Treats a skipped smoke-build (an unchanged target) as pass, and blocks on failure or cancelled (D1.5, D7.4).
  # Only a pull_request run takes the ruleset-bound name.
  # So a dispatch on a pull request's head cannot post the required check without that pull request's gates.
  check-workflow-status:
    name: ${{ github.event_name == 'pull_request' && 'Check pull request workflow status job' || 'Check workflow status job' }}
    runs-on: ubuntu-latest
    needs: [changes, read-versions, validate, smoke-build]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "changes:${{ needs.changes.result }}" "read-versions:${{ needs.read-versions.result }}" "validate:${{ needs.validate.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
          if [[ "${{ needs.smoke-build.result }}" != "success" && "${{ needs.smoke-build.result }}" != "skipped" ]]; then
            echo "::error::Job 'smoke-build' did not succeed (${{ needs.smoke-build.result }})."
            exit 1
          fi
