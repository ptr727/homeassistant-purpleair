name: Build project release task

on:
  workflow_call:
    inputs:
      # Whether to publish to GitHub Releases. Callers set this to false to
      # validate the build pipeline (test-release-task) and true to actually
      # publish (publish-release).
      github:
        required: true
        type: boolean

jobs:

  get-version:
    name: Get version information job
    uses: ./.github/workflows/get-version-task.yml
    secrets: inherit

  build:
    name: Build release artifact job
    runs-on: ubuntu-latest
    needs: [get-version]

    steps:

      - name: Checkout the repository step
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Stamp manifest.json with NBGV version step
        # The checked-in manifest.json carries a "0.0.0" placeholder; the real
        # SemVer2 lives in NBGV (computed from version.json + git history).
        # Rewrite the field in-place on the runner before zipping so the zip
        # uploaded to HACS carries the actual release version. The change is
        # only on the runner workspace — no commit is created.
        env:
          SEMVER2: ${{ needs.get-version.outputs.SemVer2 }}
        run: |
          set -euo pipefail
          jq --arg v "$SEMVER2" '.version=$v' \
             custom_components/purpleair/manifest.json > custom_components/purpleair/manifest.json.tmp
          mv custom_components/purpleair/manifest.json.tmp custom_components/purpleair/manifest.json
          echo "Stamped manifest.json version: $(jq -r .version custom_components/purpleair/manifest.json)"

      - name: Build purpleair.zip step
        # Files-at-root layout — REQUIRED by HACS when hacs.json sets
        # `zip_release: true` + `filename`. HACS extracts the asset directly
        # into <config>/custom_components/<domain>/, so the zip's contents
        # must be the integration's files at root (manifest.json,
        # __init__.py, ...). A zip that nests them under a purpleair/
        # directory ends up at <config>/custom_components/purpleair/purpleair/,
        # which HA can't find. Manual installers should still be able to
        # extract this zip into a directory of their choosing
        # (e.g. <config>/custom_components/purpleair/) and have it work.
        # Exclude __pycache__/*.pyc as defense in depth (a clean CI checkout
        # won't have them, but local re-runs of this script might).
        # Force a fresh archive — `zip` updates in place if the file exists,
        # which on a re-run could carry stale entries (e.g. the old nested
        # purpleair/ wrapper) alongside the new root files.
        run: |
          set -euo pipefail
          rm -f purpleair.zip
          cd custom_components/purpleair
          zip -r ../../purpleair.zip . -x '__pycache__/*' '*.pyc'
          cd ../..
          unzip -l purpleair.zip

      - name: Assert zip layout step
        # Belt-and-braces guard against the HACS double-nesting regression
        # this PR fixes: HACS extracts the asset into
        # <config>/custom_components/<domain>/ directly, so manifest.json
        # and __init__.py must be at the archive root. If a future change
        # accidentally restores the nested-purpleair/ layout, fail the
        # build here rather than ship a release that breaks every HACS
        # install.
        #
        # Normalize a leading `./` from stored entries before matching:
        # `zip -r ... .` is allowed to record paths as either `manifest.json`
        # or `./manifest.json` depending on Info-ZIP version, and an
        # unnormalized check could miss a `./purpleair/` wrapper.
        run: |
          set -euo pipefail
          entries=$(unzip -Z1 purpleair.zip | sed 's|^\./||')
          if ! echo "$entries" | grep -qx 'manifest.json'; then
              echo "::error::purpleair.zip missing manifest.json at root — HACS layout regression?"
              unzip -l purpleair.zip
              exit 1
          fi
          if ! echo "$entries" | grep -qx '__init__.py'; then
              echo "::error::purpleair.zip missing __init__.py at root — HACS layout regression?"
              unzip -l purpleair.zip
              exit 1
          fi
          if echo "$entries" | grep -qE '^purpleair/'; then
              echo "::error::purpleair.zip contains a top-level purpleair/ wrapper — HACS would extract one level too deep."
              unzip -l purpleair.zip
              exit 1
          fi
          echo "Zip layout OK: manifest.json + __init__.py at root, no purpleair/ wrapper."

      - name: Upload release artifact step
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: purpleair-zip
          path: purpleair.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release job
    runs-on: ubuntu-latest
    needs: [get-version, build]
    if: ${{ inputs.github }}

    steps:

      - name: Download release artifact step
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: purpleair-zip
          path: ./Publish

      - name: Create GitHub release step
        # softprops creates the underlying tag from `tag_name` if it does not
        # already exist, so the workflow drives the entire release lifecycle:
        # NBGV computes the version, this step creates the tag + release with
        # auto-generated notes, and the artifact is attached in one shot.
        # `target_commitish` MUST be set explicitly: softprops doesn't pass a
        # default through, and GitHub's REST API then defaults the new tag to
        # the repository's default branch (main). On `push: develop` runs the
        # tag would land on main's tip instead of the develop commit that
        # built the artifact, leaving "Browse files" and `git checkout <tag>`
        # pointing at unrelated code.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ needs.get-version.outputs.Tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.get-version.outputs.Prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ./Publish/purpleair.zip
