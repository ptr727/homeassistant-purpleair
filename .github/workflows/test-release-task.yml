name: Test release task

on:
  workflow_call:
    inputs:
      # Controls whether the no-publish build-release child job runs.
      # PR-trigger callers (test-pull-request.yml) want it true so the
      # build path is validated end-to-end on every PR.
      # The publish-release.yml caller wants it false because create-release builds the zip for real immediately after.
      build:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    # Mirror the workflow_call input so manual `gh workflow run
    # test-release-task.yml` dispatches behave the same. Without this,
    # `inputs.build` is unset on dispatch and the `if: ${{ inputs.build }}`
    # condition on build-release evaluates falsy regardless of the
    # workflow_call default.
    inputs:
      build:
        description: "Whether to run the no-publish build-release child job."
        required: false
        type: boolean
        default: true

jobs:

  ruff:
    name: Ruff job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python step
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install requirements step
        run: python3 -m pip install -r requirements.txt

      - name: Lint step
        run: python3 -m ruff check .

      - name: Format step
        run: python3 -m ruff format . --check

  mypy:
    name: Mypy strict-typing job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python step
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install requirements step
        run: python3 -m pip install -r requirements-test.txt

      - name: Run mypy --strict step
        # Platinum quality-scale rule "strict-typing" requires a clean run.
        run: python3 -m mypy --strict --follow-imports=silent custom_components/purpleair/

  pyright:
    name: Pyright job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python step
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install requirements step
        run: python3 -m pip install -r requirements-test.txt

      - name: Run pyright step
        # Pyright is the CLI engine behind VS Code's Pylance extension; running
        # it here keeps the in-editor and CI experience in sync. Scope, mode,
        # and enabled rules are configured in pyrightconfig.json.
        run: python3 -m pyright

  # Documentation, workflow, and shell linting - the editor's non-Python checks enforced in CI from the same
  # shared config (.markdownlint-cli2.jsonc, cspell.json). README.md and HISTORY.md must be markdown- and
  # spelling-clean; all workflows and shell scripts must lint clean.
  docs:
    name: Docs lint job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint markdown step
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

      # Spell-check the user-facing docs; the word list + exclusions live in cspell.json (shared with the editor).
      - name: Spell check step
        uses: streetsidesoftware/cspell-action@6f3c77c1406bc930f944ba97e9801a22e42caf58 # v9.1.0
        with:
          files: |
            README.md
            HISTORY.md
          incremental_files_only: false

      - name: Lint workflows step
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Check line endings step
        run: docker run --rm -v "$PWD":/check --workdir /check mstruebing/editorconfig-checker@sha256:67b9e9b16a674e36f7c05919da789f03a01d343ca8423eb8797179399af07c00 # editorconfig-checker v3.4.0

      # shellcheck is preinstalled on ubuntu-latest runners; actionlint above covers embedded workflow shell.
      - name: Lint shell scripts step
        run: shellcheck scripts/*

      # actionlint reads no composite action's run: bodies, so each hook's shell is extracted with the preinstalled yq and shellchecked.
      - name: Lint composite action shell step
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/action-shell"
          mkdir -p "$out"
          for action in .github/actions/*/action.yml; do
            name=$(basename "$(dirname "$action")")
            count=$(yq '.runs.steps | length' "$action")
            for ((i = 0; i < count; i++)); do
              body=$(yq ".runs.steps[$i].run // \"\"" "$action")
              if [[ -n "$body" ]]; then
                printf '%s\n' "$body" > "$out/$name-$i.sh"
              fi
            done
          done
          shellcheck -s bash "$out"/*.sh

      # The hub release task is each hook's only caller, so no local workflow lets actionlint read the action metadata.
      - name: Validate composite action schema step
        run: pipx run check-jsonschema --builtin-schema vendor.github-actions -- .github/actions/*/action.yml

      - name: Check shell formatting step
        run: docker run --rm -v "$PWD":/mnt --workdir /mnt mvdan/shfmt@sha256:8c06884a35683d8763fba6c0d9484d11a61a96da65f8d497d6f625825a6043f2 -d scripts/* # shfmt v3.14.1

  read-versions:
    name: Read HA test matrix job
    # The matrix is sourced from .github/ha-test-versions.json so that
    # check-ha-version.yml can bump it via PR. `minimum` is hand-maintained
    # and must match hacs.json["homeassistant"] (the user-facing minimum);
    # currently 2026.8.0, the first release with the per-config-entry
    # device lookup (`async_get_device_by_identifier`) the integration
    # uses. requirements.txt's `homeassistant==X`
    # is a dev/CI bootstrap pin tracking `latest-stable` so the devcontainer
    # develops against the release most users run; the pytest step below
    # overrides it per matrix leg with
    # `pip install --upgrade homeassistant==<ha-version>` so every slot -
    # `minimum` included - is gated regardless. `latest-stable` and
    # `latest-beta` are bot-maintained.
    # The beta slot is optional (null when no HA pre-release is newer than the
    # current stable). All three slots gate merges and prerelease publishes
    # equally - a regression against any one fails the PR.
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.parse.outputs.include }}
    steps:
      - name: Checkout the repository step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build matrix include array step
        id: parse
        run: |
          set -Eeuo pipefail
          INCLUDE=$(jq -c '
            [
              (.minimum         | { "python-version": "3.14", "ha-version": .ha, "pytest-hacc-version": ."pytest-hacc", "label": "minimum",               "aiopurpleair": "minimum" }),
              (."latest-stable" | { "python-version": "3.14", "ha-version": .ha, "pytest-hacc-version": ."pytest-hacc", "label": "latest-stable",         "aiopurpleair": "pin"     }),
              (."latest-stable" | { "python-version": "3.14", "ha-version": .ha, "pytest-hacc-version": ."pytest-hacc", "label": "latest-stable-min-lib", "aiopurpleair": "minimum" })
            ]
            + ( if ."latest-beta" then
                [ ."latest-beta" | { "python-version": "3.14", "ha-version": .ha, "pytest-hacc-version": ."pytest-hacc", "label": "latest-beta",           "aiopurpleair": "pin"     } ]
              else [] end )
          ' .github/ha-test-versions.json)
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"
          echo "Matrix: $INCLUDE"

  pytest:
    name: "pytest job (HA ${{ matrix.ha-version }}, ${{ matrix.label }})"
    runs-on: ubuntu-latest
    needs: [read-versions]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.read-versions.outputs.include) }}
    steps:
      - name: Checkout the repository step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }} step
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies step
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements-test.txt
          python -m pip install --upgrade \
            homeassistant==${{ matrix.ha-version }} \
            pytest-homeassistant-custom-component==${{ matrix.pytest-hacc-version }}

      - name: Install the manifest's minimum aiopurpleair step
        # HA keeps an installed library while it satisfies the manifest's >= minimum.
        # A venv install can therefore stay on an old release across HA updates.
        # Dependabot moves only the requirements-test.txt pin.
        # The minimum and latest-stable-min-lib legs test the oldest allowed release.
        if: ${{ matrix.aiopurpleair == 'minimum' }}
        run: |
          set -Eeuo pipefail
          requirement=$(jq -er '
            [.requirements[] | select(startswith("ptr727-aiopurpleair>="))]
            | if length == 1 then .[0]
              else error("expected exactly one ptr727-aiopurpleair>= requirement") end
          ' custom_components/purpleair/manifest.json)
          minimum=${requirement#ptr727-aiopurpleair>=}
          if [[ ! "$minimum" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Unsupported manifest requirement: $requirement"
            exit 1
          fi
          python -m pip install "ptr727-aiopurpleair==$minimum"
          installed=$(python -c "import importlib.metadata as m; print(m.version('ptr727-aiopurpleair'))")
          # PEP 440 equality pads with zeros, so 1.1 installs 1.1.0
          if ! python -c "import sys; from packaging.version import Version; sys.exit(Version(sys.argv[1]) != Version(sys.argv[2]))" "$installed" "$minimum"; then
            echo "::error::Installed ptr727-aiopurpleair $installed, expected $minimum"
            exit 1
          fi
          echo "Testing ptr727-aiopurpleair $installed, the manifest minimum"

      - name: Type-check against the manifest's minimum aiopurpleair step
        # The tests mock the API client without a spec, so they miss calls the minimum lacks.
        # The library ships type hints, so mypy against the installed minimum catches them.
        # The standalone mypy job does not type-check against the minimum HA, but the minimum leg does.
        if: ${{ matrix.aiopurpleair == 'minimum' }}
        run: python -m mypy --strict --follow-imports=silent custom_components/purpleair/

      - name: Run pytest step
        run: python -m pytest -ra --cov=custom_components/purpleair --cov-report=xml --cov-branch

      - name: Upload coverage to Codecov step
        # Tokenless OIDC uploads fail on protected-branch PR runs ("Token required because branch is protected").
        # The upload therefore always uses CODECOV_TOKEN.
        # The `flags` value keys on the leg label and HA version, so each leg stays distinct even when versions coincide.
        # The repo's overall coverage badge merges all uploads for a SHA.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.label }}-ha-${{ matrix.ha-version }}
          fail_ci_if_error: false

  hassfest:
    # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest validation job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hassfest validation step
        uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master

  hacs:
    # https://github.com/hacs/action
    name: HACS validation job
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation step
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  build-release:
    name: Build release without publishing job
    needs: [ruff, mypy, pyright, pytest, hassfest, hacs]
    # workflow_call delivers inputs.build as a real boolean (`true`/`false`)
    # but workflow_dispatch delivers it as the *string* `"true"`/`"false"`,
    # and the GitHub expression parser treats any non-empty string as truthy
    # - so a bare `if: ${{ inputs.build }}` would run this job even on a
    # manual dispatch with build=false. Compare against both forms.
    if: ${{ inputs.build == true || inputs.build == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@6b1b1477752e4998db98cc5af67605d4319e05a2 # 2.0.807
    with:
      # Smoke mode builds purpleair.zip through the hook and never uploads or publishes it.
      smoke: true
      branch: ${{ github.base_ref || github.ref_name }}
      enable_release_asset: true
      enable_docker: false
      enable_nuget: false
      enable_pypi: false
      enable_dotnet_publish: false
