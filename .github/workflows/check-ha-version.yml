name: Check Home Assistant version action

on:
  schedule:
    # Daily at 06:00 UTC. HA stable releases land mid-cycle (typically the
    # first Wednesday of the month) and betas trickle in throughout the
    # cycle; daily cadence keeps the test matrix within ~24h of upstream
    # pytest-homeassistant-custom-component on PyPI. workflow_dispatch is
    # available for urgent bumps.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  check:
    name: Check pytest-homeassistant-custom-component for newer HA pin job
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Generate GitHub App token step
        # Use the codegen App so the resulting PR is App-authored: that triggers
        # PR workflows (PRs from GITHUB_TOKEN do not) and lets merge-bot pick
        # it up via the actor guard. `client-id` replaces the deprecated
        # `app-id` per actions/create-github-app-token v3+.
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Checkout the repository step
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python step
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install resolver dependencies step
        # `packaging` provides PEP-440 ordering that correctly ranks
        # 2026.5.0b0 < 2026.5.0 < 2026.6.0b0 — `sort -V` happens to agree
        # today but isn't a contract.
        run: python3 -m pip install --quiet packaging

      - name: Resolve latest stable + beta pytest-hacc/HA pairs step
        id: resolve
        # Walk pytest-homeassistant-custom-component versions newest-first
        # on PyPI, fetching each release's `homeassistant==` pin until we
        # find both:
        #   - the highest pytest-hacc whose pin is a stable HA release
        #     (`latest-stable` slot, replaces the old single `latest`),
        #   - and, if newer than that stable, the highest pytest-hacc whose
        #     pin is a pre-release HA (`latest-beta` slot).
        # All three matrix slots gate equally; the beta slot is omitted
        # entirely when no upcoming-HA beta exists. The walk hard-caps at
        # the 10 most-recent pytest-hacc versions to bound runner time:
        # 1 index fetch + 10 per-version fetches × 15s timeout = ~165s
        # worst case. In practice it terminates within 1-2 fetches when
        # the latest pytest-hacc pins a stable,
        # and within ~4-7 during an active HA beta cycle. Hitting the cap
        # without finding a stable is unprecedented in upstream history;
        # the resolver fails loudly so a maintainer can investigate before
        # relaxing the cap.
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import urllib.request
          from packaging.version import Version

          PKG = "pytest-homeassistant-custom-component"
          BASE = f"https://pypi.org/pypi/{PKG}"

          def fetch(url):
              # 15s per request keeps the bot predictable when PyPI stalls;
              # without a timeout urllib waits indefinitely and the daily
              # cron can pile up runners. Combined with WALK_LIMIT below
              # this bounds total resolver time to ~165s worst case (1 index fetch + 10 per-version fetches × 15s).
              with urllib.request.urlopen(url, timeout=15) as r:
                  return json.loads(r.read())

          def ha_pin(release):
              for req in release["info"].get("requires_dist") or []:
                  if req.startswith("homeassistant=="):
                      return req[len("homeassistant=="):].split(";")[0].strip()
              return None

          WALK_LIMIT = 10

          idx = fetch(f"{BASE}/json")
          versions = sorted(idx["releases"].keys(), key=Version, reverse=True)

          stable = None          # (hacc, ha) — highest pytest-hacc with stable HA pin
          beta_candidate = None  # (hacc, ha) — highest pytest-hacc with prerelease HA pin

          for v in versions[:WALK_LIMIT]:
              ha = ha_pin(fetch(f"{BASE}/{v}/json"))
              if not ha:
                  continue
              if Version(ha).is_prerelease:
                  if beta_candidate is None:
                      beta_candidate = (v, ha)
              else:
                  stable = (v, ha)
                  break

          if stable is None:
              raise SystemExit(
                  f"No stable {PKG} release found within the {WALK_LIMIT} most "
                  f"recent versions on PyPI; this is unprecedented in upstream "
                  f"history — investigate before relaxing the cap."
              )

          beta = beta_candidate
          if beta and Version(beta[1]) <= Version(stable[1]):
              # Beta pin is older than (or equal to) the latest stable —
              # nothing useful to early-warn against.
              beta = None

          print(f"stable_hacc={stable[0]}")
          print(f"stable_ha={stable[1]}")
          print(f"beta_hacc={beta[0] if beta else ''}")
          print(f"beta_ha={beta[1] if beta else ''}")
          PY

      # ---- Apply changes + open one PR per cron tick ---------------------
      # Both `latest-stable` and `latest-beta` updates are bundled into a
      # single PR on a single rolling branch. The earlier two-PR design
      # had a real race: when a new stable supersedes the current beta,
      # the resolver would emit a stable bump *and* a beta clear at the
      # same time. Two independent auto-merging PRs could then land out
      # of order, leaving develop with stale stable + null beta until
      # the second merged. Bundling makes the matrix update atomic —
      # either the whole thing lands or nothing does.

      - name: Apply matrix changes and build PR metadata step
        id: apply
        env:
          STABLE_HACC: ${{ steps.resolve.outputs.stable_hacc }}
          STABLE_HA: ${{ steps.resolve.outputs.stable_ha }}
          BETA_HACC: ${{ steps.resolve.outputs.beta_hacc }}
          BETA_HA: ${{ steps.resolve.outputs.beta_ha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          path = ".github/ha-test-versions.json"
          with open(path) as f:
              data = json.load(f)

          res_s = (os.environ["STABLE_HACC"], os.environ["STABLE_HA"])
          res_b = (os.environ["BETA_HACC"], os.environ["BETA_HA"])

          cur_s = (
              data["latest-stable"]["pytest-hacc"],
              data["latest-stable"]["ha"],
          )
          cur_beta_obj = data.get("latest-beta")
          cur_b = (
              (cur_beta_obj["pytest-hacc"], cur_beta_obj["ha"])
              if cur_beta_obj else ("", "")
          )

          stable_changed = res_s != cur_s
          beta_changed = res_b != cur_b
          any_changed = stable_changed or beta_changed
          print(f"any_changed={'true' if any_changed else 'false'}")

          if not any_changed:
              raise SystemExit(0)

          if stable_changed:
              data["latest-stable"] = {"ha": res_s[1], "pytest-hacc": res_s[0]}
          if beta_changed:
              data["latest-beta"] = (
                  {"ha": res_b[1], "pytest-hacc": res_b[0]} if res_b[0] else None
              )

          with open(path, "w") as f:
              # ensure_ascii=False preserves the em-dash and other non-ASCII
              # characters in the existing $comment field; the default would
              # rewrite "—" as "—" and produce a noisy diff every run.
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")

          # Title — single line, summarises every change.
          parts = []
          if stable_changed:
              parts.append(f"stable: {res_s[1]}")
          if beta_changed:
              parts.append(f"beta: {res_b[1]}" if res_b[1] else "clear beta")
          title = f"Bump HA test matrix ({', '.join(parts)})"
          print(f"title={title}")

          # Body — multi-line via the GHA output delimiter syntax.
          body = [
              "Bumps the bot-maintained HA test-matrix slots in"
              " `.github/ha-test-versions.json`.",
          ]
          if stable_changed:
              body += [
                  "",
                  "### `latest-stable`",
                  "",
                  f"- HA: `{cur_s[1]}` → `{res_s[1]}`",
                  f"- pytest-hacc: `{cur_s[0]}` → `{res_s[0]}`",
                  f"- HA release notes: https://github.com/home-assistant/core/releases/tag/{res_s[1]}",
                  f"- pytest-hacc release: https://pypi.org/project/pytest-homeassistant-custom-component/{res_s[0]}/",
              ]
          if beta_changed:
              body += ["", "### `latest-beta`", ""]
              if res_b[1]:
                  body += [
                      f"- HA: `{cur_b[1] or '(none)'}` → `{res_b[1]}`",
                      f"- pytest-hacc: `{cur_b[0] or '(none)'}` → `{res_b[0]}`",
                      f"- HA release notes: https://github.com/home-assistant/core/releases/tag/{res_b[1]}",
                      f"- pytest-hacc release: https://pypi.org/project/pytest-homeassistant-custom-component/{res_b[0]}/",
                  ]
              else:
                  body += [
                      f"Cleared. The previous beta pin (`{cur_b[1]}`) is no longer"
                      " newer than the current stable pin — there is no upcoming HA"
                      " pre-release on PyPI to test against.",
                  ]
          body += [
              "",
              "All three matrix slots gate equally — this PR auto-merges only when"
              " tests pass against `minimum`, `latest-stable`, and (if non-null)"
              " `latest-beta`. If a new HA beta breaks the integration, this PR"
              " stays open until the integration is updated to support it.",
          ]

          print("body<<MATRIX_PR_BODY_EOF")
          print("\n".join(body))
          print("MATRIX_PR_BODY_EOF")
          PY

      - name: Create matrix bump pull request step
        if: steps.apply.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        # Single rolling branch — at most one bot PR open at a time.
        # peter-evans force-pushes the latest pending matrix update
        # (stable, beta, or both) to this branch on every cron tick,
        # so the PR refreshes in place instead of accumulating per-
        # version. Audit trail lives in the PR title/body and the
        # merged commit on develop, not in branch names.
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: develop
          branch: ha-version-bump/matrix
          delete-branch: true
          sign-commits: true
          title: ${{ steps.apply.outputs.title }}
          commit-message: ${{ steps.apply.outputs.title }}
          body: ${{ steps.apply.outputs.body }}
