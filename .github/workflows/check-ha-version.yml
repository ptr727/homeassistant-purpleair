name: Check Home Assistant version action

on:
  schedule:
    # Daily at 06:00 UTC. HA stable releases land mid-cycle (typically the
    # first Wednesday of the month) and betas trickle in throughout the
    # cycle; daily cadence keeps the test matrix within ~24h of upstream
    # pytest-homeassistant-custom-component on PyPI. workflow_dispatch is
    # available for urgent bumps.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  check:
    name: Check pytest-homeassistant-custom-component for newer HA pin job
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Generate GitHub App token step
        # Use the codegen App so the resulting PR is App-authored: that triggers
        # PR workflows (PRs from GITHUB_TOKEN do not) and lets merge-bot pick
        # it up via the actor guard. `client-id` replaces the deprecated
        # `app-id` per actions/create-github-app-token v3+.
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CODEGEN_APP_CLIENT_ID }}
          private-key: ${{ secrets.CODEGEN_APP_PRIVATE_KEY }}

      - name: Checkout the repository step
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python step
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install resolver dependencies step
        # `packaging` provides PEP-440 ordering that correctly ranks
        # 2026.5.0b0 < 2026.5.0 < 2026.6.0b0 — `sort -V` happens to agree
        # today but isn't a contract.
        run: python3 -m pip install --quiet packaging

      - name: Resolve latest stable + beta pytest-hacc/HA pairs step
        id: resolve
        # Walk pytest-homeassistant-custom-component versions newest-first
        # on PyPI, fetching each release's `homeassistant==` pin until we
        # find both:
        #   - the highest pytest-hacc whose pin is a stable HA release
        #     (`latest-stable` slot, replaces the old single `latest`),
        #   - and, if newer than that stable, the highest pytest-hacc whose
        #     pin is a pre-release HA (`latest-beta` slot).
        # All three matrix slots gate equally; the beta slot is omitted
        # entirely when no upcoming-HA beta exists. The walk hard-caps at
        # the 10 most-recent pytest-hacc versions to bound runner time:
        # 1 index fetch + 10 per-version fetches × 15s timeout = ~165s
        # worst case. In practice it terminates within 1-2 fetches when
        # the latest pytest-hacc pins a stable,
        # and within ~4-7 during an active HA beta cycle. Hitting the cap
        # without finding a stable is unprecedented in upstream history;
        # the resolver fails loudly so a maintainer can investigate before
        # relaxing the cap.
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import urllib.request
          from packaging.version import Version

          PKG = "pytest-homeassistant-custom-component"
          BASE = f"https://pypi.org/pypi/{PKG}"

          def fetch(url):
              # 15s per request keeps the bot predictable when PyPI stalls;
              # without a timeout urllib waits indefinitely and the daily
              # cron can pile up runners. Combined with WALK_LIMIT below
              # this bounds total resolver time to ~165s worst case (1 index fetch + 10 per-version fetches × 15s).
              with urllib.request.urlopen(url, timeout=15) as r:
                  return json.loads(r.read())

          def ha_pin(release):
              for req in release["info"].get("requires_dist") or []:
                  if req.startswith("homeassistant=="):
                      return req[len("homeassistant=="):].split(";")[0].strip()
              return None

          WALK_LIMIT = 10

          idx = fetch(f"{BASE}/json")
          versions = sorted(idx["releases"].keys(), key=Version, reverse=True)

          stable = None          # (hacc, ha) — highest pytest-hacc with stable HA pin
          beta_candidate = None  # (hacc, ha) — highest pytest-hacc with prerelease HA pin

          for v in versions[:WALK_LIMIT]:
              ha = ha_pin(fetch(f"{BASE}/{v}/json"))
              if not ha:
                  continue
              if Version(ha).is_prerelease:
                  if beta_candidate is None:
                      beta_candidate = (v, ha)
              else:
                  stable = (v, ha)
                  break

          if stable is None:
              raise SystemExit(
                  f"No stable {PKG} release found within the {WALK_LIMIT} most "
                  f"recent versions on PyPI; this is unprecedented in upstream "
                  f"history — investigate before relaxing the cap."
              )

          beta = beta_candidate
          if beta and Version(beta[1]) <= Version(stable[1]):
              # Beta pin is older than (or equal to) the latest stable —
              # nothing useful to early-warn against.
              beta = None

          print(f"stable_hacc={stable[0]}")
          print(f"stable_ha={stable[1]}")
          print(f"beta_hacc={beta[0] if beta else ''}")
          print(f"beta_ha={beta[1] if beta else ''}")
          PY

      - name: Read currently pinned versions step
        id: current
        run: |
          set -euo pipefail
          {
            echo "stable_hacc=$(jq -r '."latest-stable"."pytest-hacc"' .github/ha-test-versions.json)"
            echo "stable_ha=$(jq   -r '."latest-stable".ha'             .github/ha-test-versions.json)"
            echo "beta_hacc=$(jq   -r '."latest-beta"."pytest-hacc" // ""' .github/ha-test-versions.json)"
            echo "beta_ha=$(jq     -r '."latest-beta".ha // ""'             .github/ha-test-versions.json)"
          } >> "$GITHUB_OUTPUT"

      # ---- Stable bump ---------------------------------------------------
      # Only modifies `latest-stable`. The beta PR (below) handles any
      # corresponding clear/promotion of `latest-beta` independently — keeping
      # diffs small and PR ownership single-purpose.

      - name: Update file for stable bump step
        id: write-stable
        if: |
          steps.resolve.outputs.stable_hacc != steps.current.outputs.stable_hacc ||
          steps.resolve.outputs.stable_ha   != steps.current.outputs.stable_ha
        env:
          STABLE_HACC: ${{ steps.resolve.outputs.stable_hacc }}
          STABLE_HA: ${{ steps.resolve.outputs.stable_ha }}
        run: |
          set -euo pipefail
          jq --arg ha   "$STABLE_HA" \
             --arg hacc "$STABLE_HACC" \
             '."latest-stable".ha = $ha
              | ."latest-stable"."pytest-hacc" = $hacc' \
             .github/ha-test-versions.json > .github/ha-test-versions.json.tmp
          mv .github/ha-test-versions.json.tmp .github/ha-test-versions.json

      - name: Create stable bump pull request step
        if: steps.write-stable.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        # Single rolling branch per stream (`stable`, `beta`). When tests
        # fail on a bump PR, the next cron tick force-pushes the next pin
        # to the same branch and the same PR keeps refreshing — a stale
        # red PR doesn't accumulate per-version. Audit trail lives in PR
        # title/body and the merged commit on develop, not in branch names.
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: develop
          branch: ha-version-bump/stable
          delete-branch: true
          sign-commits: true
          title: "Bump HA test matrix (stable) to ${{ steps.resolve.outputs.stable_ha }}"
          commit-message: "Bump HA test matrix (stable) to ${{ steps.resolve.outputs.stable_ha }}"
          body: |
            Bumps `latest-stable` in `.github/ha-test-versions.json` to
            `${{ steps.resolve.outputs.stable_ha }}` (via
            `pytest-homeassistant-custom-component` `${{ steps.resolve.outputs.stable_hacc }}`).

            - Home Assistant release notes: https://github.com/home-assistant/core/releases/tag/${{ steps.resolve.outputs.stable_ha }}
            - pytest-homeassistant-custom-component release: https://pypi.org/project/pytest-homeassistant-custom-component/${{ steps.resolve.outputs.stable_hacc }}/

            Tests run against the new version on this PR. If they pass,
            merge-bot auto-merges into develop and the bump rolls into the
            next prerelease published from develop.

      # ---- Beta bump (separate PR, gates equally with stable) -----------
      # `latest-beta` tracks the highest pytest-hacc whose HA pin is a
      # pre-release strictly newer than `latest-stable.ha`. When no such
      # beta exists (typical right after a stable lands), the resolver
      # returns empty strings and this PR sets the slot to null.

      - name: Reset ha-test-versions.json before beta write step
        # peter-evans/create-pull-request commits the working-tree diff to
        # its PR branch and then `git checkout`s back to the source ref,
        # so the file should already be at develop's state here. This
        # explicit restore is defensive: if that internal behaviour ever
        # changes, a stale stable-bump edit must NOT leak into the beta
        # PR. Cheap no-op when the file is already clean.
        run: git checkout HEAD -- .github/ha-test-versions.json

      - name: Update file for beta change step
        id: write-beta
        if: |
          steps.resolve.outputs.beta_hacc != steps.current.outputs.beta_hacc ||
          steps.resolve.outputs.beta_ha   != steps.current.outputs.beta_ha
        env:
          BETA_HACC: ${{ steps.resolve.outputs.beta_hacc }}
          BETA_HA: ${{ steps.resolve.outputs.beta_ha }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2153  # BETA_HA is set via env: above
          if [ -z "$BETA_HACC" ]; then
              jq '."latest-beta" = null' \
                 .github/ha-test-versions.json > .github/ha-test-versions.json.tmp
          else
              jq --arg ha   "$BETA_HA" \
                 --arg hacc "$BETA_HACC" \
                 '."latest-beta" = { "ha": $ha, "pytest-hacc": $hacc }' \
                 .github/ha-test-versions.json > .github/ha-test-versions.json.tmp
          fi
          mv .github/ha-test-versions.json.tmp .github/ha-test-versions.json

      - name: Create beta change pull request step
        if: steps.write-beta.outcome == 'success'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: develop
          branch: ha-version-bump/beta
          delete-branch: true
          sign-commits: true
          title: ${{ steps.resolve.outputs.beta_ha != '' && format('Bump HA test matrix (beta) to {0}', steps.resolve.outputs.beta_ha) || 'Clear HA test matrix beta slot' }}
          commit-message: ${{ steps.resolve.outputs.beta_ha != '' && format('Bump HA test matrix (beta) to {0}', steps.resolve.outputs.beta_ha) || 'Clear HA test matrix beta slot' }}
          body: |
            ${{ steps.resolve.outputs.beta_ha != '' && format('Bumps `latest-beta` in `.github/ha-test-versions.json` to `{0}` (via `pytest-homeassistant-custom-component` `{1}`).', steps.resolve.outputs.beta_ha, steps.resolve.outputs.beta_hacc) || format('Clears `latest-beta` in `.github/ha-test-versions.json`. The previous beta pin (`{0}`) is no longer newer than the current stable pin — there is no upcoming HA pre-release on PyPI to test against.', steps.current.outputs.beta_ha) }}

            The beta slot gates equally with `minimum` and `latest-stable`:
            tests must pass against this version for the bot's PR to
            auto-merge. If a new HA beta breaks the integration, this PR
            stays open until the integration is updated to support it.

            ${{ steps.resolve.outputs.beta_ha != '' && format('- Home Assistant release notes: https://github.com/home-assistant/core/releases/tag/{0}', steps.resolve.outputs.beta_ha) || '' }}
            ${{ steps.resolve.outputs.beta_ha != '' && format('- pytest-homeassistant-custom-component release: https://pypi.org/project/pytest-homeassistant-custom-component/{0}/', steps.resolve.outputs.beta_hacc) || '' }}
