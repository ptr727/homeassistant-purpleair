---
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Dual-target main AND develop: every ecosystem is duplicated so Dependabot
# keeps both branches updated and avoids merge drift between them. develop's
# bumps join the bot-tested develop line; main's bumps keep the shipped branch
# current without waiting on a develop -> main promotion.
#
# Scheduled version updates honor `target-branch`. Dependabot security update
# PRs (the CVE-driven ones) always open against the default branch (main) and
# ignore `target-branch`; the merge-bot `case` in
# merge-bot-pull-request.yml handles either base, and a maintainer can
# retarget from the PR UI if a one-off needs the other branch.
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"

  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
    ignore:
      # Home Assistant version is owned by check-ha-version.yml (from
      # pytest-homeassistant-custom-component on PyPI) and by hacs.json's
      # `homeassistant` field - not Dependabot.
      - dependency-name: "homeassistant"
      # pytest-homeassistant-custom-component pins a specific HA version, so it
      # moves in lockstep with .github/ha-test-versions.json via check-ha-version.yml.
      - dependency-name: "pytest-homeassistant-custom-component"
      # pytest-homeassistant-custom-component also pins pytest-cov, so widening
      # this constraint independently can break resolution.
      - dependency-name: "pytest-cov"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    ignore:
      # Home Assistant version is owned by check-ha-version.yml (from
      # pytest-homeassistant-custom-component on PyPI) and by hacs.json's
      # `homeassistant` field - not Dependabot.
      - dependency-name: "homeassistant"
      # pytest-homeassistant-custom-component pins a specific HA version, so it
      # moves in lockstep with .github/ha-test-versions.json via check-ha-version.yml.
      - dependency-name: "pytest-homeassistant-custom-component"
      # pytest-homeassistant-custom-component also pins pytest-cov, so widening
      # this constraint independently can break resolution.
      - dependency-name: "pytest-cov"
