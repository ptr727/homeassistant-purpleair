---
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# `target-branch: "develop"` on every ecosystem entry routes Dependabot's
# scheduled version-update PRs to the integration branch instead of the
# repo default (`main`). That keeps dep bumps in the
# `feature → develop → main` flow described in AGENTS.md: each bump joins
# the bot-triggered develop prerelease for early-warning testing, then
# bundles into the next develop → main merge-commit alongside feature work.
#
# Caveat: `target-branch` only redirects scheduled version updates.
# Dependabot *security update PRs* (the CVE-driven ones Dependabot opens
# in response to security alerts) are opened against the default branch
# (`main`) and do not honor `target-branch`. The merge-bot's `case`
# statement in .github/workflows/merge-bot-pull-request.yml handles
# either base correctly, and a maintainer can retarget manually from
# the PR UI if a one-off needs the other branch.
version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    ignore:
      # Home Assistant version is owned by check-ha-version.yml (which derives
      # it from pytest-homeassistant-custom-component on PyPI) and by the
      # `homeassistant` field in hacs.json — not by Dependabot.
      - dependency-name: "homeassistant"
      # pytest-homeassistant-custom-component pins a specific Home Assistant
      # version, so it must move in lockstep with .github/ha-test-versions.json
      # via check-ha-version.yml rather than an independent Dependabot PR.
      - dependency-name: "pytest-homeassistant-custom-component"
      # pytest-homeassistant-custom-component also pins its pytest-cov version,
      # so widening this direct constraint independently can break resolution.
      - dependency-name: "pytest-cov"
